openapi: 3.0.3
info:
  title: Regretcast
  version: 0.1.0
  description: >-
    Workforce commitment register for scenario-based planning. Four competing 2030
    worlds are held as versioned objects; every people commitment is scored for its
    payoff in each, classified as a no-regrets move or a bet by computation rather
    than assertion, priced for jurisdiction consultation and notice obligations, and
    armed with monitored tripwires so a change of world becomes a scheduled decision.
  x-product-slug: ai-hr-regretcast
  x-source: ai-in-hr/workforce-of-the-future-the-competing-forces-shaping-2030-pwc/
servers:
  - url: https://api.example.com
tags:
  - name: Worlds
    description: Scenario library, megatrend drivers, assumptions, and probability weightings
  - name: Commitments
    description: Registered workforce decision objects with owners, budget lines, and reversibility
  - name: Payoff
    description: Cross-world payoff scoring, regret profiles, and classification
  - name: Portfolio
    description: Portfolio summary, plan comparison, and scheduled board review
  - name: Tripwires
    description: Armed indicators, readings, responses, and world-drift assessment
  - name: Skills
    description: Skills-not-roles inventory and per-world capability gaps
  - name: Jurisdictions
    description: Consultation, notice, severance obligations and redeployment options
  - name: PivotalTalent
    description: Pivotal roles and per-world retention and burnout exposure
  - name: Narrative
    description: Aggregate workforce sentiment and the internal narrative record
  - name: Governance
    description: Confidentiality tiers, disclosure log, and immutable version history
paths:
  /v1/worlds:
    get:
      operationId: listWorldScenarios
      summary: List the world scenarios in force
      tags: [Worlds]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: World scenarios page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeWorldScenario"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/worlds/{worldId}:
    parameters:
      - $ref: "#/components/parameters/WorldId"
    get:
      operationId: getWorldScenario
      summary: Get a world scenario with axis positions and demanded-skills profile
      tags: [Worlds]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: World scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorldScenario"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/worlds/{worldId}/versions:
    parameters:
      - $ref: "#/components/parameters/WorldId"
    post:
      operationId: publishWorldScenarioVersion
      summary: Publish an immutable new version of a world scenario definition
      tags: [Worlds]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldScenarioVersionCreate"
      responses:
        "201":
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorldScenario"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/worlds/{worldId}/probability-weighting:
    parameters:
      - $ref: "#/components/parameters/WorldId"
    put:
      operationId: setWorldProbabilityWeighting
      summary: Set the declared belief weighting for a world
      description: >-
        Weightings are recorded as declared beliefs with an author and rationale,
        not as forecasts. Changing a weighting re-derives portfolio regret but never
        rewrites a historic classification.
      tags: [Worlds]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weighting, rationale, declaredBy]
              properties:
                weighting:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                rationale:
                  type: string
                declaredBy:
                  type: string
      responses:
        "200":
          description: Weighting recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorldScenario"
  /v1/worlds/{worldId}/drivers:
    parameters:
      - $ref: "#/components/parameters/WorldId"
    get:
      operationId: listMegatrendDrivers
      summary: List the observable megatrend drivers underpinning a world
      tags: [Worlds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Megatrend drivers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeMegatrendDriver"
  /v1/assumptions:
    get:
      operationId: listAssumptions
      summary: List versioned planning assumptions with authorship
      tags: [Worlds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: worldId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Assumptions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAssumption"
  /v1/commitments:
    get:
      operationId: listCommitments
      summary: List registered workforce commitments
      tags: [Commitments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: classification
          in: query
          schema:
            $ref: "#/components/schemas/ClassificationClass"
        - name: jurisdiction
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scored, approved, executing, closed, withdrawn]
      responses:
        "200":
          description: Commitments page, filtered by the caller's confidentiality tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCommitment"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: registerCommitment
      summary: Register a workforce commitment as a decision object
      tags: [Commitments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitmentCreate"
      responses:
        "201":
          description: Commitment registered, pending payoff assessment in all worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCommitment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/commitments/{commitmentId}:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    get:
      operationId: getCommitment
      summary: Get a commitment with its payoff assessments and obligations
      tags: [Commitments]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCommitment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/commitments/{commitmentId}/approval:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: approveCommitment
      summary: Approve a commitment for release into the workforce and financial plan
      description: >-
        Rejected where the commitment has no payoff assessment in every world, where
        a bet has no armed tripwire, or where success depends on a pivotal person
        flagged as a flight or burnout risk without a funded mitigation.
      tags: [Commitments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy]
              properties:
                approvedBy:
                  type: string
                approvalForum:
                  type: string
                  enum: [executive_committee, board_people_committee, capital_approval, functional_delegation]
                note:
                  type: string
      responses:
        "200":
          description: Commitment approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCommitment"
        "409":
          description: Approval preconditions not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/commitments/{commitmentId}/jurisdiction-feasibility:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: recordJurisdictionFeasibility
      summary: Record or veto in-country feasibility inside the assumed lead time
      tags: [Commitments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JurisdictionFeasibilityCreate"
      responses:
        "201":
          description: Feasibility position recorded against the commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeJurisdictionFeasibility"
  /v1/commitments/{commitmentId}/reskilling-takeup:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: reforecastReskillingTakeup
      summary: Re-forecast a reskilling commitment against actual take-up
      tags: [Commitments]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReskillingTakeupForecastCreate"
      responses:
        "201":
          description: Take-up re-forecast recorded and variance computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReskillingTakeupForecast"
  /v1/commitments/{commitmentId}/payoff-assessments:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    get:
      operationId: listPayoffAssessments
      summary: List the per-world payoff assessments for a commitment
      tags: [Payoff]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Payoff assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePayoffAssessment"
    post:
      operationId: scoreCommitmentPayoff
      summary: Score a commitment's payoff in one world with a named rationale
      tags: [Payoff]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoffAssessmentCreate"
      responses:
        "201":
          description: Payoff assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePayoffAssessment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/commitments/{commitmentId}/regret-profile:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    get:
      operationId: getRegretProfile
      summary: Get the computed regret profile across worlds
      tags: [Payoff]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Regret profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegretProfile"
        "409":
          description: Payoff assessment missing for one or more worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/commitments/{commitmentId}/classification:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    get:
      operationId: getClassification
      summary: Get the derived no-regrets or bet classification
      tags: [Payoff]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeClassification"
  /v1/commitments/{commitmentId}/classification/override:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: overrideClassification
      summary: Override a derived classification with recorded reasons
      tags: [Payoff]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrideTo, rationale, overriddenBy]
              properties:
                overrideTo:
                  $ref: "#/components/schemas/ClassificationClass"
                rationale:
                  type: string
                overriddenBy:
                  type: string
      responses:
        "200":
          description: Classification overridden, with the derived value retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeClassification"
  /v1/payoff-rubrics:
    get:
      operationId: listPayoffRubrics
      summary: List versioned payoff scoring rubrics
      tags: [Payoff]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Payoff rubrics page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePayoffRubric"
  /v1/portfolio/summary:
    get:
      operationId: getPortfolioSummary
      summary: Get portfolio regret exposure and the no-regrets versus bet split
      tags: [Portfolio]
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: query
          schema:
            type: string
        - name: jurisdiction
          in: query
          schema:
            type: string
        - name: asOfDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioSummary"
  /v1/portfolio/comparisons:
    post:
      operationId: comparePlans
      summary: Compare two candidate plans on regret exposure rather than expected value alone
      tags: [Portfolio]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planAId, planBId]
              properties:
                planAId:
                  type: string
                planBId:
                  type: string
                criterion:
                  type: string
                  enum: [max_regret, expected_value, robustness_across_worlds, stranded_cost]
      responses:
        "200":
          description: Plan comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePlanComparison"
  /v1/portfolio/reviews:
    get:
      operationId: listPortfolioReviews
      summary: List scheduled portfolio reviews
      tags: [Portfolio]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Portfolio reviews page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePortfolioReview"
    post:
      operationId: schedulePortfolioReview
      summary: Schedule a portfolio review against the budget and capital calendar
      tags: [Portfolio]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioReviewCreate"
      responses:
        "201":
          description: Review scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioReview"
  /v1/tripwires:
    get:
      operationId: listTripwires
      summary: List armed tripwires and their status
      tags: [Tripwires]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [armed, breached, response_executed, response_overdue, retired]
        - name: commitmentId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tripwires page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTripwire"
    post:
      operationId: armTripwire
      summary: Arm a tripwire on a bet with a threshold, owner and pre-agreed response
      tags: [Tripwires]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripwireCreate"
      responses:
        "201":
          description: Tripwire armed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTripwire"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/tripwires/{tripwireId}/readings:
    parameters:
      - $ref: "#/components/parameters/TripwireId"
    get:
      operationId: listTripwireReadings
      summary: List indicator readings for a tripwire
      tags: [Tripwires]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tripwire readings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTripwireReading"
    post:
      operationId: recordTripwireReading
      summary: Record an indicator reading from an external or internal feed
      tags: [Tripwires]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripwireReadingCreate"
      responses:
        "201":
          description: Reading recorded, threshold evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTripwireReading"
  /v1/tripwires/{tripwireId}/response:
    parameters:
      - $ref: "#/components/parameters/TripwireId"
    post:
      operationId: executeTripwireResponse
      summary: Record execution of the pre-agreed response after a breach
      tags: [Tripwires]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, executedBy]
              properties:
                action:
                  type: string
                  enum: [proceed_unchanged, pause, descope, reverse, accelerate, reclassify, escalate_to_board]
                executedBy:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTripwire"
        "409":
          description: Tripwire is not in a breached state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/drift-assessments:
    get:
      operationId: listDriftAssessments
      summary: List published world-drift assessments
      tags: [Tripwires]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Drift assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDriftAssessment"
    post:
      operationId: publishDriftAssessment
      summary: Publish an assessment of which world conditions are moving toward
      tags: [Tripwires]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriftAssessmentCreate"
      responses:
        "201":
          description: Drift assessment published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDriftAssessment"
  /v1/skills/inventory:
    get:
      operationId: listSkillInventory
      summary: List the skills-not-roles inventory
      tags: [Skills]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: function
          in: query
          schema:
            type: string
        - name: jurisdiction
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Skill inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSkillInventoryEntry"
    post:
      operationId: upsertSkillInventoryEntry
      summary: Add or update an inventory entry, accreting skills beyond job titles
      tags: [Skills]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInventoryEntryCreate"
      responses:
        "200":
          description: Inventory entry upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSkillInventoryEntry"
  /v1/skills/demand-profiles:
    get:
      operationId: listSkillDemandProfiles
      summary: List the skills each world demands
      tags: [Skills]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: worldId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Skill demand profiles page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSkillDemandProfile"
  /v1/skills/gaps:
    get:
      operationId: getCapabilityGapByWorld
      summary: Get the capability gap expressed per world rather than as one number
      tags: [Skills]
      security:
        - BearerAuth: []
      parameters:
        - name: function
          in: query
          required: true
          schema:
            type: string
        - name: horizonYear
          in: query
          schema:
            type: integer
            example: 2030
      responses:
        "200":
          description: Capability gap per world
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapabilityGap"
  /v1/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List jurisdictions in scope with their labour regime profile
      tags: [Jurisdictions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Jurisdictions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeJurisdiction"
  /v1/jurisdictions/{jurisdictionCode}/obligations:
    parameters:
      - $ref: "#/components/parameters/JurisdictionCode"
    get:
      operationId: listJurisdictionObligations
      summary: List consultation, notice, severance and redeployment obligations
      tags: [Jurisdictions]
      security:
        - BearerAuth: []
      parameters:
        - name: triggerType
          in: query
          schema:
            type: string
            enum: [collective_redundancy, individual_redundancy, transfer_of_undertaking, material_change_to_terms, site_closure]
      responses:
        "200":
          description: Jurisdiction obligations page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeJurisdictionObligation"
  /v1/commitments/{commitmentId}/consultation-plan:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: buildConsultationPlan
      summary: Build the consultation and notice timetable inside the commitment lead time
      tags: [Jurisdictions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jurisdictionCode, triggerType, affectedHeadcount]
              properties:
                jurisdictionCode:
                  type: string
                triggerType:
                  type: string
                  enum: [collective_redundancy, individual_redundancy, transfer_of_undertaking, material_change_to_terms, site_closure]
                affectedHeadcount:
                  type: integer
                proposedStartDate:
                  type: string
                  format: date
      responses:
        "201":
          description: Consultation plan with statutory clocks and cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsultationPlan"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/commitments/{commitmentId}/consultation-pack:
    parameters:
      - $ref: "#/components/parameters/CommitmentId"
    post:
      operationId: releaseConsultationPack
      summary: Release the information and consultation pack to representatives
      description: >-
        Released by a human holding the duty. Release includes the underlying
        assumptions and lifts the confidentiality tier for the named recipients,
        writing each recipient to the disclosure log.
      tags: [Jurisdictions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients, releasedBy]
              properties:
                recipients:
                  type: array
