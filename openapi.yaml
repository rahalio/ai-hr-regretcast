            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVersionRecord"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    WorldId:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    CommitmentId:
      name: commitmentId
      in: path
      required: true
      schema:
        type: string
    TripwireId:
      name: tripwireId
      in: path
      required: true
      schema:
        type: string
    JurisdictionCode:
      name: jurisdictionCode
      in: path
      required: true
      schema:
        type: string
    PivotalRoleId:
      name: pivotalRoleId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Caller's confidentiality tier does not permit access to this scenario or record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: EUR
    ClassificationClass:
      type: string
      enum: [no_regrets, bet, unclassified]
    ReversibilityClass:
      type: string
      enum: [reversible, costly_to_reverse, irreversible]
    CommitmentType:
      type: string
      enum: [hiring_plan, reskilling_programme, site_footprint, automation_initiative, contingent_mix_change, reward_redesign, operating_model_change, outsourcing_arrangement]
    WorldScenario:
      type: object
      required: [id, code, name, version]
      properties:
        id:
          type: string
        code:
          type: string
          enum: [red, blue, green, yellow]
        name:
          type: string
          example: Innovation rules
        version:
          type: integer
        collectivismIndividualismAxis:
          type: string
          enum: [collectivism, individualism]
        integrationFragmentationAxis:
          type: string
          enum: [corporate_integration, business_fragmentation]
        summary:
          type: string
        hrOperatingModelImplication:
          type: string
          description: What this world does to the people function, for example HR absorbed by Guilds or a board-level Head of People and Productivity
        talentModel:
          type: string
        regulatoryPosture:
          type: string
        probabilityWeighting:
          type: number
          format: float
        weightingRationale:
          type: string
        weightingDeclaredBy:
          type: string
        demandedSkillsProfileId:
          type: string
        publishedAt:
          type: string
          format: date-time
    WorldScenarioVersionCreate:
      type: object
      required: [summary, hrOperatingModelImplication, authoredBy]
      properties:
        summary:
          type: string
        hrOperatingModelImplication:
          type: string
        talentModel:
          type: string
        regulatoryPosture:
          type: string
        demandedSkillsProfileId:
          type: string
        authoredBy:
          type: string
        changeRationale:
          type: string
    MegatrendDriver:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          enum: [technological_breakthroughs, demographic_shifts, rapid_urbanisation, shifts_in_global_economic_power, resource_scarcity_and_climate_change]
        worldIds:
          type: array
          items:
            type: string
        observableIndicators:
          type: array
          items:
            type: string
        directionOfTravel:
          type: string
          enum: [reinforcing, weakening, ambiguous]
        notes:
          type: string
    Assumption:
      type: object
      required: [id, statement, version, authoredBy]
      properties:
        id:
          type: string
        statement:
          type: string
        version:
          type: integer
        worldId:
          type: string
        category:
          type: string
          enum: [automation_exposure, labour_supply, regulation, wage_trajectory, take_up_behaviour, technology_maturity]
        value:
          type: string
        sourceReference:
          type: string
        authoredBy:
          type: string
        supersededByAssumptionId:
          type: string
        createdAt:
          type: string
          format: date-time
    PayoffRubric:
      type: object
      required: [id, version, scale]
      properties:
        id:
          type: string
        version:
          type: integer
        scale:
          type: string
          enum: [minus_three_to_plus_three, minus_five_to_plus_five, monetary]
        dimensions:
          type: array
          items:
            type: string
            enum: [cost, capability_fit, speed, reputational, legal_exposure, employee_experience]
        guidance:
          type: string
        authoredBy:
          type: string
        lockedAt:
          type: string
          format: date-time
    Commitment:
      type: object
      required: [id, title, commitmentType, ownerName, status]
      properties:
        id:
          type: string
        title:
          type: string
        commitmentType:
          $ref: "#/components/schemas/CommitmentType"
        description:
          type: string
        ownerName:
          type: string
          description: Named accountable owner, not a function
        budgetLineReference:
          type: string
        committedAmount:
          $ref: "#/components/schemas/Money"
        decisionDate:
          type: string
          format: date
        reversibility:
          $ref: "#/components/schemas/ReversibilityClass"
        affectedFunctions:
          type: array
          items:
            type: string
        jurisdictions:
          type: array
          items:
            type: string
        headcountImpact:
          type: integer
        impliesHeadcountReduction:
          type: boolean
        assumedLeadTimeDays:
          type: integer
        modelledLeadTimeDays:
          type: integer
          description: Lead time after jurisdiction consultation and notice obligations are priced in
        dependsOnPivotalRoleIds:
          type: array
          items:
            type: string
        assumedReskillingTakeUpRate:
          type: number
          format: float
        confidentialityTier:
          type: string
        classification:
          $ref: "#/components/schemas/ClassificationClass"
        status:
          type: string
          enum: [draft, scored, approved, executing, closed, withdrawn]
        approvedBy:
          type: string
        planId:
          type: string
    CommitmentCreate:
      type: object
      required: [title, commitmentType, ownerName, decisionDate, reversibility]
      properties:
        title:
          type: string
        commitmentType:
          $ref: "#/components/schemas/CommitmentType"
        description:
          type: string
        ownerName:
          type: string
        budgetLineReference:
          type: string
        committedAmount:
          $ref: "#/components/schemas/Money"
        decisionDate:
          type: string
          format: date
        reversibility:
          $ref: "#/components/schemas/ReversibilityClass"
        affectedFunctions:
          type: array
          items:
            type: string
        jurisdictions:
          type: array
          items:
            type: string
        headcountImpact:
          type: integer
        impliesHeadcountReduction:
          type: boolean
        assumedLeadTimeDays:
          type: integer
        assumedReskillingTakeUpRate:
          type: number
          format: float
        confidentialityTier:
          type: string
        planId:
          type: string
    PayoffAssessment:
      type: object
      required: [id, commitmentId, worldId, score, scoredBy]
      properties:
        id:
          type: string
        commitmentId:
          type: string
        worldId:
          type: string
        rubricVersion:
          type: integer
        score:
          type: number
          format: float
        dimensionScores:
          type: object
          additionalProperties:
            type: number
            format: float
        rationale:
          type: string
        strandedCostIfWorldDiffers:
          $ref: "#/components/schemas/Money"
        scoredBy:
          type: string
          description: Named human judgement, never a model output
        scoredAt:
          type: string
          format: date-time
        worldVersionAtScoring:
          type: integer
    PayoffAssessmentCreate:
      type: object
      required: [worldId, score, rationale, scoredBy]
      properties:
        worldId:
          type: string
        score:
          type: number
          format: float
        dimensionScores:
          type: object
          additionalProperties:
            type: number
            format: float
        rationale:
          type: string
        strandedCostIfWorldDiffers:
          $ref: "#/components/schemas/Money"
        scoredBy:
          type: string
    RegretProfile:
      type: object
      required: [commitmentId, maxRegret]
      properties:
        commitmentId:
          type: string
        perWorldRegret:
          type: array
          items:
            type: object
            properties:
              worldId:
                type: string
              worldCode:
                type: string
              payoffScore:
                type: number
                format: float
              regret:
                type: number
                format: float
              strandedCost:
                $ref: "#/components/schemas/Money"
        maxRegret:
          type: number
          format: float
        minPayoffAcrossWorlds:
          type: number
          format: float
        payoffSpread:
          type: number
          format: float
        weightedExpectedPayoff:
          type: number
          format: float
        robustAcrossAllWorlds:
          type: boolean
        computedAt:
          type: string
          format: date-time
    Classification:
      type: object
      required: [commitmentId, derivedClass]
      properties:
        commitmentId:
          type: string
        derivedClass:
          $ref: "#/components/schemas/ClassificationClass"
        derivationBasis:
          type: string
          description: For example positive payoff in all four worlds, or negative in at least one
        effectiveClass:
          $ref: "#/components/schemas/ClassificationClass"
        overridden:
          type: boolean
        overrideRationale:
          type: string
        overriddenBy:
          type: string
        requiresTripwire:
          type: boolean
        armedTripwireCount:
          type: integer
        changedSinceLastReview:
          type: boolean
        classifiedAt:
          type: string
          format: date-time
    JurisdictionFeasibility:
      type: object
      required: [id, commitmentId, jurisdictionCode, position]
      properties:
        id:
          type: string
        commitmentId:
          type: string
        jurisdictionCode:
          type: string
        position:
          type: string
          enum: [feasible_as_assumed, feasible_with_longer_lead_time, not_feasible]
        minimumFeasibleLeadTimeDays:
          type: integer
        reasons:
          type: string
        recordedBy:
          type: string
          description: Country HR director holding the local legal reality
        recordedAt:
          type: string
          format: date-time
    JurisdictionFeasibilityCreate:
      type: object
      required: [jurisdictionCode, position, reasons, recordedBy]
      properties:
        jurisdictionCode:
          type: string
        position:
          type: string
          enum: [feasible_as_assumed, feasible_with_longer_lead_time, not_feasible]
        minimumFeasibleLeadTimeDays:
          type: integer
        reasons:
          type: string
        recordedBy:
          type: string
    ReskillingTakeupForecast:
      type: object
      required: [id, commitmentId, assumedRate, actualRate]
      properties:
        id:
          type: string
        commitmentId:
          type: string
        period:
          type: string
        assumedRate:
          type: number
          format: float
        actualRate:
          type: number
          format: float
        variance:
          type: number
          format: float
        eligiblePopulation:
          type: integer
        enrolledPopulation:
          type: integer
        completedPopulation:
          type: integer
        reforecastRate:
          type: number
          format: float
        note:
          type: string
    ReskillingTakeupForecastCreate:
      type: object
      required: [period, actualRate, eligiblePopulation]
      properties:
        period:
          type: string
        actualRate:
          type: number
          format: float
        eligiblePopulation:
          type: integer
        enrolledPopulation:
          type: integer
        completedPopulation:
          type: integer
        reforecastRate:
          type: number
          format: float
        note:
          type: string
    Tripwire:
      type: object
      required: [id, commitmentId, indicatorName, threshold, ownerName, status]
      properties:
        id:
          type: string
        commitmentId:
          type: string
        indicatorName:
          type: string
        indicatorSource:
          type: string
          enum: [external_labour_market, regulatory_tracker, macro_indicator, internal_pipeline, internal_sentiment, programme_milestone]
        signalsWorldId:
          type: string
          description: The world this indicator moving would evidence
        threshold:
          type: number
          format: float
        thresholdDirection:
          type: string
          enum: [above, below, crosses]
        unit:
          type: string
        ownerName:
          type: string
        reviewDate:
          type: string
          format: date
        preAgreedResponse:
          type: string
          enum: [proceed_unchanged, pause, descope, reverse, accelerate, reclassify, escalate_to_board]
        responseWindowDays:
          type: integer
        status:
          type: string
          enum: [armed, breached, response_executed, response_overdue, retired]
        breachedAt:
          type: string
          format: date-time
        responseExecutedAt:
          type: string
          format: date-time
        responseExecutedBy:
          type: string
    TripwireCreate:
      type: object
      required: [commitmentId, indicatorName, threshold, thresholdDirection, ownerName, preAgreedResponse]
      properties:
        commitmentId:
          type: string
        indicatorName:
          type: string
        indicatorSource:
          type: string
          enum: [external_labour_market, regulatory_tracker, macro_indicator, internal_pipeline, internal_sentiment, programme_milestone]
        signalsWorldId:
          type: string
        threshold:
          type: number
          format: float
        thresholdDirection:
          type: string
          enum: [above, below, crosses]
        unit:
          type: string
        ownerName:
          type: string
        reviewDate:
          type: string
          format: date
        preAgreedResponse:
          type: string
          enum: [proceed_unchanged, pause, descope, reverse, accelerate, reclassify, escalate_to_board]
        responseWindowDays:
          type: integer
    TripwireReading:
      type: object
      required: [id, tripwireId, value, observedAt]
      properties:
        id:
          type: string
        tripwireId:
          type: string
        value:
          type: number
          format: float
        observedAt:
          type: string
          format: date-time
        sourceReference:
          type: string
        breachedThreshold:
          type: boolean
        providerName:
          type: string
    TripwireReadingCreate:
      type: object
      required: [value, observedAt]
      properties:
        value:
          type: number
          format: float
        observedAt:
          type: string
          format: date-time
        sourceReference:
          type: string
        providerName:
          type: string
    DriftAssessment:
      type: object
      required: [id, assessedAt, leadingWorldId]
      properties:
        id:
          type: string
        assessedAt:
          type: string
          format: date-time
        leadingWorldId:
          type: string
        perWorldEvidenceStrength:
          type: array
          items:
            type: object
            properties:
              worldId:
                type: string
              worldCode:
                type: string
              evidenceStrength:
                type: number
                format: float
              supportingIndicators:
                type: array
                items:
                  type: string
        breachedTripwireCount:
          type: integer
        commitmentsRequiringReclassification:
          type: array
          items:
            type: string
        narrative:
          type: string
        assessedBy:
          type: string
    DriftAssessmentCreate:
      type: object
      required: [leadingWorldId, narrative, assessedBy]
      properties:
        leadingWorldId:
          type: string
        narrative:
          type: string
        assessedBy:
          type: string
    PortfolioSummary:
      type: object
      properties:
        planId:
          type: string
        asOfDate:
          type: string
          format: date
        commitmentCount:
          type: integer
        scoredInAllWorldsCount:
          type: integer
        noRegretsCommittedSpend:
          $ref: "#/components/schemas/Money"
        betCommittedSpend:
          $ref: "#/components/schemas/Money"
        noRegretsHeadcountImpact:
          type: integer
        betHeadcountImpact:
          type: integer
        portfolioMaxRegret:
          type: number
          format: float
        totalStrandedCostExposure:
          $ref: "#/components/schemas/Money"
        betsWithArmedTripwireShare:
          type: number
          format: float
        overdueTripwireResponses:
          type: integer
